[project]
name = "document-analysis-backend"
version = "0.1.0"
description = "FastAPI backend for the Document Analysis Platform (Claude + RAG over PostgreSQL/pgvector)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/Header) in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
